name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --python 3.12 --locked --group dev --extra lmdb
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --python '${{ matrix.python }}' --locked --group dev --extra lmdb
      - run: uv run --locked pytest --cov=langchain_gestaltdb --cov-report=term-missing --cov-fail-under=90

  latest-dependencies:
    name: Latest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --python 3.12 --group dev --extra lmdb --upgrade
      - run: uv run --frozen pytest

  additional-backends:
    name: Backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: leveldb
            extra: leveldb
          - backend: pyrex
            extra: rocksdb
    env:
      GESTALTDB_TEST_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LevelDB native library
        if: matrix.backend == 'leveldb'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libleveldb-dev
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --python 3.12 --locked --group dev --extra lmdb --extra '${{ matrix.extra }}'
      - run: uv run --locked pytest tests/integration_tests/test_backend_contract.py

  minimum-dependencies:
    name: Minimum direct dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      # Deliberately re-resolve in the disposable runner, not against uv.lock.
      - run: uv sync --python 3.10 --group dev --extra lmdb --resolution lowest-direct
      - run: uv run --frozen pytest

  distribution:
    name: Installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --python 3.12 --locked --group dev --extra lmdb
      - run: uv build --no-sources
      - run: uv run --locked twine check dist/*
      - name: Validate release artifact contents
        run: |
          version=$(uv run --locked python -c 'from importlib.metadata import version; print(version("langchain-gestaltdb"))')
          uv run --locked python scripts/release.py verify-artifacts "$version"
      - name: Test installed wheel outside the checkout
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-env"
          wheel=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" "${wheel}[lmdb]" 'pytest>=8,<10' 'langchain-tests==1.0.0'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c 'import langchain_gestaltdb; assert "site-packages" in langchain_gestaltdb.__file__'
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" -c "$GITHUB_WORKSPACE/pyproject.toml"
      - name: Retain the tested main distributions for explicitly approved releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  gate:
    name: CI gate
    if: always()
    needs: [quality, tests, minimum-dependencies, latest-dependencies, additional-backends, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit(f"Required CI jobs did not succeed: {failed}")
          PY
