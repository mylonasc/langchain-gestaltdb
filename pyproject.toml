[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "langchain-gestaltdb"
version = "0.1.0.dev0"
description = "A graph-first LangChain integration for GestaltDB"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "gestaltdb>=0.12.0,<0.13",
    "langchain-core>=1.0,<2",
    "pydantic>=2.7,<3",
]

[project.urls]
Repository = "https://github.com/mylonasc/langchain-gestaltdb"
Issues = "https://github.com/mylonasc/langchain-gestaltdb/issues"

[project.optional-dependencies]
lmdb = ["gestaltdb[lmdb]>=0.12.0,<0.13"]
leveldb = ["gestaltdb[leveldb]>=0.12.0,<0.13"]
rocksdb = ["gestaltdb[rocksdb]>=0.12.0,<0.13"]

[dependency-groups]
dev = [
    # Keep the standard-suite baseline compatible with the declared Core 1.0 floor.
    "langchain-tests==1.0.0",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "twine>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_gestaltdb"]
# Twine 6's metadata parser does not yet accept Hatchling's 2.5 default.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/langchain_gestaltdb", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = ["integration: tests using a real temporary embedded database"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["langchain_gestaltdb"]

[[tool.mypy.overrides]]
module = ["gestaltdb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# TD-01: NumPy's current stubs use 3.12 syntax; this package targets 3.10 and
# does not expose NumPy types. Do not weaken checks for our own modules.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
